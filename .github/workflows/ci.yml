name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lecturarag-backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lecturarag-backend/requirements.txt

      - name: Compile Python sources
        working-directory: lecturarag-backend
        run: python -m compileall -q app seed_sample.py tests

      - name: Run API verification suite
        working-directory: lecturarag-backend
        run: python tests/test_api.py

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lecturarag-front/package-lock.json

      - name: Install dependencies
        working-directory: lecturarag-front
        run: npm ci

      - name: Typecheck
        working-directory: lecturarag-front
        run: npm run typecheck

      - name: Build
        working-directory: lecturarag-front
        run: npm run build
